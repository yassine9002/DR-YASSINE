name: Build DR YASSINE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q DR_YASSINE_Android_Prototype.zip -d android-project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find android-project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            find android-project -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Make Gradle executable
        run: chmod +x "$GRADLEW"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          find android-project -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DR-YASSINE-APK
          path: android-project/**/build/outputs/apk/**/*.apk
